name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: automatic-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Create release tag and changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
      changelog: ${{ steps.release_info.outputs.changelog }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag and collect commit messages
        id: release_info
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$package_version" ]]; then
            echo "Could not read package version from Cargo.toml"
            exit 1
          fi
          release_tag="v${package_version}"

          if git show-ref --tags --verify --quiet "refs/tags/$release_tag"; then
            echo "Release tag $release_tag already exists. Bump the version in Cargo.toml before pushing."
            exit 1
          fi

          previous_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"

          if [[ -n "$previous_tag" ]]; then
            commits="$(git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD")"
          else
            commits="$(git log --pretty=format:'- %s (%h)' HEAD)"
          fi

          if [[ -z "$commits" ]]; then
            commits="- Automated release for commit ${GITHUB_SHA::7}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_tag" "$GITHUB_SHA" -m "Release $release_tag"
          git push origin "$release_tag"

          {
            echo "tag=$release_tag"
            echo 'changelog<<CHANGELOG_EOF'
            echo "$commits"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            platform: windows
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/repo-hub.exe release/repo-hub-windows-x86_64.exe

      - name: Package Linux binary
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release
          cp target/release/repo-hub release/repo-hub-linux-x86_64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-hub-${{ matrix.platform }}
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: repo-hub-*
          merge-multiple: true
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          body: ${{ needs.prepare.outputs.changelog }}
          files: release/*