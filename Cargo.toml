[package]
name = "repo-hub"
version = "0.1.0"
edition = "2021"
description = "A blazing-fast TUI that discovers every Git repository across all drives and lets you manage them without leaving the terminal"
license = "MIT"

[[bin]]
name = "repo-hub"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ignore = "0.4"
git2 = { version = "0.19", default-features = false }
dirs = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
